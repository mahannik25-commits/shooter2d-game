<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Mobile Shooter</title>
<style>
    body {
        margin: 0;
        overflow: hidden;
        background: black;
        touch-action: none;
    }
    canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        background: radial-gradient(circle at top, #0a0f25, #000);
    }
    #score {
        position: fixed;
        top: 10px;
        left: 10px;
        color: white;
        font-size: 22px;
        font-family: sans-serif;
        text-shadow: 0 0 10px #00eaff;
    }
</style>
</head>
<body>

<canvas id="game"></canvas>
<div id="score">0</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
let W, H;

function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

// ---------------------- Player ----------------------
let player = {
    x: W/2,
    y: H*0.8,
    r: 18,
    speed: 0.15
};

// ---------------------- Touch Control ----------------------
let touch = { active: false, x: 0, y: 0 };

canvas.addEventListener("touchstart", e => {
    touch.active = true;
    touch.x = e.touches[0].clientX;
    touch.y = e.touches[0].clientY;
});
canvas.addEventListener("touchmove", e => {
    touch.x = e.touches[0].clientX;
    touch.y = e.touches[0].clientY;
});
canvas.addEventListener("touchend", () => touch.active = false);

// ---------------------- Bullets ----------------------
let bullets = [];
function shoot() {
    bullets.push({ x: player.x, y: player.y - 20, r: 5 });
}
setInterval(shoot, 150);

// ---------------------- Enemies ----------------------
let enemies = [];
function spawnEnemy() {
    enemies.push({
        x: Math.random() * W,
        y: -20,
        r: 20,
        speed: 2 + Math.random() * 2
    });
}
setInterval(spawnEnemy, 600);

// ---------------------- Particles ----------------------
let particles = [];
function explode(x, y) {
    for (let i = 0; i < 15; i++) {
        particles.push({
            x, y,
            vx: (Math.random() - 0.5) * 4,
            vy: (Math.random() - 0.5) * 4,
            life: 20
        });
    }
}

// ---------------------- Score ----------------------
let score = 0;
const scoreEl = document.getElementById("score");

// ---------------------- Game Loop ----------------------
function loop() {
    ctx.clearRect(0, 0, W, H);

    // Move player
    if (touch.active) {
        player.x += (touch.x - player.x) * player.speed;
        player.y += (touch.y - player.y) * player.speed;
    }

    // Draw player
    ctx.fillStyle = "#5affd8";
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2);
    ctx.fill();

    // Bullets
    ctx.fillStyle = "yellow";
    bullets.forEach((b, i) => {
        b.y -= 8;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fill();
        if (b.y < -10) bullets.splice(i, 1);
    });

    // Enemies
    ctx.fillStyle = "red";
    enemies.forEach((e, ei) => {
        e.y += e.speed;
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
        ctx.fill();

        // Collision with player
        let dx = e.x - player.x;
        let dy = e.y - player.y;
        if (dx*dx + dy*dy < (e.r + player.r)**2) {
            alert("Game Over! Score: " + score);
            location.reload();
        }

        // Collision with bullets
        bullets.forEach((b, bi) => {
            let dx = e.x - b.x;
            let dy = e.y - b.y;
            if (dx*dx + dy*dy < (e.r + b.r)**2) {
                explode(e.x, e.y);
                enemies.splice(ei, 1);
                bullets.splice(bi, 1);
                score += 10;
                scoreEl.textContent = score;
            }
        });

        if (e.y > H + 30) enemies.splice(ei, 1);
    });

    // Particles
    particles.forEach((p, pi) => {
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        ctx.fillStyle = "orange";
        ctx.fillRect(p.x, p.y, 3, 3);
        if (p.life <= 0) particles.splice(pi, 1);
    });

    requestAnimationFrame(loop);
}
loop();
</script>

</body>
</html>
